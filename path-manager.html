<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Path Manager - Asset Register</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app-container" id="appContainer" style="display:none;">
  <div class="sidebar">
    <div class="brand"><h1>Asset Register</h1><p>IT Infrastructure</p></div>
    <div class="nav-menu">
      <a href="index.html" class="nav-item">📊 Dashboard</a>
      <a href="system-details.html" class="nav-item">🖥️ System Details</a>
      <a href="rentals.html" class="nav-item">🚚 Rental Details</a>
      <a href="extra-assets.html" class="nav-item">📦 Extra Assets</a>
      <a href="path-manager.html" class="nav-item active">🗂️ Path Manager</a>
      <button class="theme-toggle" onclick="toggleTheme()">🌗 Theme</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="main-content">
    <div class="topbar"><h2>Path Manager</h2></div>
    <div class="rental-form">
      <h3>Add / Edit Path</h3>
      <div class="form-grid">
        <div class="form-group"><label>Category</label><select id="pmCategory"><option value="S3D">S3D</option><option value="PDS">PDS</option><option value="SPPID">SPPID</option><option value="SPI">SPI</option><option value="Other">Other</option></select></div>
        <div class="form-group"><label>Backup Name</label><input type="text" id="pmName"></div>
        <div class="form-group"><label>Folder Path</label><input type="text" id="pmPath"></div>
      </div>
      <button class="btn primary" id="pmAddBtn">+ Add Path</button>
      <button class="btn ghost" id="pmCancelBtn" style="display:none;">Cancel Edit</button>
    </div>
    <div class="table-container">
      <table><thead><tr><th>Category</th><th>Backup Name</th><th>Folder Path</th><th>Actions</th></tr></thead><tbody id="pmTableBody"></tbody></table>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAcBaKxlFC4Yqg4SNdg8l0lbo9dFCNTtJU",
    authDomain: "asset-register-website.firebaseapp.com",
    projectId: "asset-register-website",
    storageBucket: "asset-register-website.firebasestorage.app",
    messagingSenderId: "921107638281",
    appId: "1:921107638281:web:ec5b50383bd4f6feea70d8",
    measurementId: "G-9DKFJ4T5XY"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let pmData = [], editingPM = -1;

  window.toggleTheme = function(){ document.body.classList.toggle('light-mode'); };
  window.logout = async function(){ await signOut(auth); window.location.href = "login.html"; };

  async function loadPaths() {
    const querySnapshot = await getDocs(collection(db, 'paths'));
    pmData = [];
    querySnapshot.forEach((doc) => { pmData.push({ id: doc.id, ...doc.data() }); });
    renderPM();
  }

  function renderPM() {
    const tbody = document.getElementById('pmTableBody'); tbody.innerHTML = '';
    pmData.forEach((p, i) => {
      tbody.innerHTML += `<tr><td>${p.category}</td><td>${p.name}</td><td>${p.path}</td><td><button class="btn" onclick="editPM(${i})">✏️</button> <button class="btn danger" onclick="deletePM(${i})">🗑️</button></td></tr>`;
    });
  }

  function clearPM() { document.getElementById('pmName').value = ''; document.getElementById('pmPath').value = ''; document.getElementById('pmAddBtn').innerText = '+ Add Path'; document.getElementById('pmCancelBtn').style.display = 'none'; editingPM = -1; }

  window.addPM = async function() {
    const d = { category: document.getElementById('pmCategory').value, name: document.getElementById('pmName').value, path: document.getElementById('pmPath').value };
    if (!d.name || !d.path) return alert("Please fill all fields");
    if (editingPM > -1) {
      await setDoc(doc(db, 'paths', pmData[editingPM].id), d);
    } else {
      await setDoc(doc(db, 'paths', Date.now().toString()), d);
    }
    clearPM(); loadPaths(); alert("Path saved!");
  };

  window.editPM = function(i) {
    editingPM = i; const p = pmData[i];
    document.getElementById('pmCategory').value = p.category;
    document.getElementById('pmName').value = p.name;
    document.getElementById('pmPath').value = p.path;
    document.getElementById('pmAddBtn').innerText = 'Update Path'; document.getElementById('pmCancelBtn').style.display = 'inline-flex';
  };

  window.deletePM = async function(i) {
    if (!confirm('Delete this path?')) return;
    await deleteDoc(doc(db, 'paths', pmData[i].id));
    loadPaths();
  };

  document.getElementById('pmAddBtn').onclick = window.addPM;
  document.getElementById('pmCancelBtn').onclick = clearPM;

  onAuthStateChanged(auth, user => {
    if (user) { document.getElementById('appContainer').style.display = 'flex'; loadPaths(); }
    else { window.location.href = "login.html"; }
  });
</script>
</body>
</html>
