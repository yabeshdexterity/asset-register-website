<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extra Assets - Asset Register</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app-container" id="appContainer" style="display:none;">
  <div class="sidebar">
    <div class="brand"><h1>Asset Register</h1><p>IT Infrastructure</p></div>
    <div class="nav-menu">
      <a href="index.html" class="nav-item">📊 Dashboard</a>
      <a href="system-details.html" class="nav-item">🖥️ System Details</a>
      <a href="rentals.html" class="nav-item">🚚 Rental Details</a>
      <a href="extra-assets.html" class="nav-item active">📦 Extra Assets</a>
      <a href="path-manager.html" class="nav-item">🗂️ Path Manager</a>
      <a href="signup.html" class="nav-item">📝 Sign Up</a>
      <button class="theme-toggle" onclick="toggleTheme()">🌗 Theme</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="main-content">
    <div class="topbar"><h2>Extra Assets</h2></div>
    <div class="rental-form">
      <h3>Add Extra Asset</h3>
      <div class="form-grid">
        <div class="form-group"><label>Asset Type</label><select id="assetType"><option value="cpu">CPU</option><option value="monitor">Monitor</option><option value="keyboard">Keyboard</option><option value="mouse">Mouse</option></select></div>
        <div class="form-group"><label>Brand</label><select id="assetBrand"></select></div>
        <div class="form-group"><label>Quantity</label><input type="number" id="assetQuantity" value="1" min="1"></div>
      </div>
      <button class="btn primary" onclick="addAsset()">+ Add Asset</button>
    </div>
    <div class="table-container">
      <table><thead><tr><th>Category</th><th>Brand</th><th>Quantity</th><th>Actions</th></tr></thead><tbody id="assetTableBody"></tbody></table>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAcBaKxlFC4Yqg4SNdg8l0lbo9dFCNTtJU",
    authDomain: "asset-register-website.firebaseapp.com",
    projectId: "asset-register-website",
    storageBucket: "asset-register-website.firebasestorage.app",
    messagingSenderId: "921107638281",
    appId: "1:921107638281:web:ec5b50383bd4f6feea70d8",
    measurementId: "G-9DKFJ4T5XY"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const BRAND_OPTIONS = { cpu: ['ACER', 'DELL', 'ZEBRONICS', 'COOLER MASTER', 'POWER X'], monitor: ['ACER', 'DELL', 'ZEBSTER', 'ZEBRONICS', 'THINK VISION', 'HP', 'KRYSTAA', 'VIEWSONIC', 'LENOVO', 'LG'], keyboard: ['DELL', 'LOGITECH', 'HP', 'PORTRONIC', 'ZEBRONICS'], mouse: ['DELL', 'LOGITECH', 'PORTRONICS', 'ZEBRONICS'] };
  let extraAssets = [];

  window.toggleTheme = function(){ document.body.classList.toggle('light-mode'); };
  window.logout = async function(){ await signOut(auth); window.location.href = "login.html"; };

  async function loadAssets() {
    const querySnapshot = await getDocs(collection(db, 'extraAssets'));
    extraAssets = [];
    querySnapshot.forEach((doc) => { extraAssets.push({ id: doc.id, ...doc.data() }); });
    renderAssets();
  }

  function renderAssets() {
    const tbody = document.getElementById('assetTableBody'); tbody.innerHTML = '';
    extraAssets.forEach((item, i) => {
      tbody.innerHTML += `<tr><td>${item.category}</td><td>${item.brand}</td><td>${item.quantity}</td><td><button class="btn danger" onclick="deleteAsset(${i})">🗑️</button></td></tr>`;
    });
  }

  function updateBrands() { const type = document.getElementById('assetType').value; const select = document.getElementById('assetBrand'); select.innerHTML = '<option value="">Select Brand...</option>'; (BRAND_OPTIONS[type] || []).forEach(b => select.innerHTML += `<option value="${b}">${b}</option>`); }

  window.addAsset = async function() {
    const type = document.getElementById('assetType').value;
    const brand = document.getElementById('assetBrand').value;
    const qty = parseInt(document.getElementById('assetQuantity').value) || 1;
    if (!brand) return alert("Please select a brand");
    await setDoc(doc(db, 'extraAssets', Date.now().toString()), { category: type, brand, quantity: qty });
    loadAssets(); alert("Asset added!");
  };

  window.deleteAsset = async function(i) {
    if (!confirm('Delete this asset?')) return;
    await deleteDoc(doc(db, 'extraAssets', extraAssets[i].id));
    loadAssets();
  };

  document.getElementById('assetType').onchange = updateBrands;
  updateBrands();

  onAuthStateChanged(auth, user => {
    if (user) { document.getElementById('appContainer').style.display = 'flex'; loadAssets(); }
    else { window.location.href = "login.html"; }
  });
</script>
</body>
</html>
