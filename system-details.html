<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Details - Asset Register</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app-container" id="appContainer" style="display:none;">
  <div class="sidebar">
    <div class="brand"><h1>Asset Register</h1><p>IT Infrastructure</p></div>
    <div class="nav-menu">
      <a href="index.html" class="nav-item">📊 Dashboard</a>
      <a href="system-details.html" class="nav-item active">🖥️ System Details</a>
      <a href="rentals.html" class="nav-item">🚚 Rental Details</a>
      <a href="extra-assets.html" class="nav-item">📦 Extra Assets</a>
      <a href="path-manager.html" class="nav-item">🗂️ Path Manager</a>
      <button class="theme-toggle" onclick="toggleTheme()">🌗 Theme</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="main-content">
    <div class="topbar">
      <h2>System Details</h2>
      <div class="topbar-actions">
        <button class="btn" onclick="loadSeats()">🔄 Sync</button>
      </div>
    </div>

    <div class="dashboard-layout">
      <div class="left-panel">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" placeholder="Search seat, name..." id="searchInput">
        </div>
        <h3 style="margin-top:0;">Seats</h3>
        <div class="seat-list" id="seatList"></div>
      </div>

      <div class="right-panel">
        <h3 style="margin-top:0;">System Details</h3>
        <div id="detailsContainer"><p style="color:var(--muted);">Select a seat to view details.</p></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="moveUserModal">
  <div class="modal">
    <h2>Move User</h2>
    <div class="form-group"><label>Select Destination Seat</label><select id="targetSeatSelect"></select></div>
    <div style="color:var(--muted);font-size:12px;margin-bottom:15px;">This will overwrite any existing data at the destination seat.</div>
    <div class="modal-actions"><button class="btn" onclick="closeMoveModal()">Cancel</button><button class="btn primary" onclick="confirmMove()">Move User</button></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAcBaKxlFC4Yqg4SNdg8l0lbo9dFCNTtJU",
    authDomain: "asset-register-website.firebaseapp.com",
    projectId: "asset-register-website",
    storageBucket: "asset-register-website.firebasestorage.app",
    messagingSenderId: "921107638281",
    appId: "1:921107638281:web:ec5b50383bd4f6feea70d8",
    measurementId: "G-9DKFJ4T5XY"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const FIELDS = [
    {key:"seating_id", label:"Seating ID"}, {key:"seating_availability", label:"Status"}, 
    {key:"employee_name", label:"Employee Name"}, {key:"employee_id", label:"Employee ID"},
    {key:"employment_type", label:"Employment Type"}, {key:"intercom_number", label:"Intercom Number"}, 
    {key:"desktop_name", label:"Desktop Name"}, {key:"ip_address", label:"IP Address"},
    {key:"processor", label:"Processor"}, {key:"ram", label:"RAM"}, {key:"graphics_card", label:"Graphics Card"},
    {key:"ssd", label:"SSD"}, {key:"hard_disk", label:"Hard Disk"}, {key:"keyboard_brand", label:"Keyboard Brand"},
    {key:"mouse_brand", label:"Mouse Brand"}, {key:"cpu_cabinet_brand", label:"CPU Cabinet Brand"}, 
    {key:"cpu_cabinet_id", label:"CPU Cabinet ID"}, {key:"monitor1_brand", label:"Monitor 1 Brand"},
    {key:"monitor1_id", label:"Monitor 1 ID"}, {key:"monitor1_inches", label:"Monitor 1 Inches"},
    {key:"monitor2_brand", label:"Monitor 2 Brand"}, {key:"monitor2_id", label:"Monitor 2 ID"},
    {key:"monitor2_inches", label:"Monitor 2 Inches"}, {key:"ownership_cpu", label:"CPU Ownership"},
    {key:"ownership_monitor1", label:"Monitor 1 Ownership"}, {key:"ownership_monitor2", label:"Monitor 2 Ownership"},
    {key:"ownership_keyboard", label:"Keyboard Ownership"}, {key:"ownership_mouse", label:"Mouse Ownership"}
  ];

  let data = [], currentSeat = null, sourceSeatToMove = null;

  window.toggleTheme = function(){ document.body.classList.toggle('light-mode'); };
  window.logout = async function(){ await signOut(auth); window.location.href = "login.html"; };

  async function loadSeats() {
    const querySnapshot = await getDocs(collection(db, 'assets'));
    data = [];
    querySnapshot.forEach((doc) => { data.push({ id: doc.id, ...doc.data() }); });
    renderSeats(document.getElementById('searchInput').value);
  }

  window.loadSeats = loadSeats;

  function renderSeats(query = '') {
    const list = document.getElementById('seatList'); list.innerHTML = '';
    data.filter(d => !query || d.seating_id.toLowerCase().includes(query) || (d.employee_name||'').toLowerCase().includes(query))
        .forEach(d => {
          const el = document.createElement('div'); el.className = 'seat-item';
          el.innerHTML = `<div class="id">${d.seating_id}</div><div class="name">${d.employee_name || 'Vacant'}</div>`;
          el.onclick = () => showDetails(d); list.appendChild(el);
        });
  }

  window.renderSeats = renderSeats;
  document.getElementById('searchInput').addEventListener('input', e => renderSeats(e.target.value.toLowerCase()));

  function showDetails(seat) {
    currentSeat = seat.id;
    const isOccupied = seat.seating_availability === 'Occupied';
    let html = '';
    FIELDS.forEach(f => { let val = seat[f.key] || ''; html += `<div class="field"><label>${f.label}</label><input type="text" id="detail_${f.key}" value="${val}"></div>`; });
    document.getElementById('detailsContainer').innerHTML = `
      <div style="display:flex;justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h3 style="margin:0;">${seat.seating_id} Details</h3>
        <div style="display:flex; gap:10px;">
          ${isOccupied ? `<button class="btn" onclick="openMoveModal('${seat.id}')">🔄 Move User</button>` : ''}
          <button class="btn primary" onclick="saveSeat()">Save</button>
        </div>
      </div>
      <div class="field-grid">${html}</div>
    `;
  }

  window.showDetails = showDetails;

  window.saveSeat = async function() {
    const seat = data.find(d => d.id === currentSeat);
    FIELDS.forEach(f => { const el = document.getElementById(`detail_${f.key}`); if (el) seat[f.key] = el.value; });
    await setDoc(doc(db, 'assets', seat.id), seat);
    alert("Seat Saved!");
  };

  window.openMoveModal = function(seatId) {
    sourceSeatToMove = seatId;
    const select = document.getElementById('targetSeatSelect'); select.innerHTML = '<option value="">Select destination seat...</option>';
    data.filter(d => d.id !== seatId).forEach(seat => {
      const option = document.createElement('option'); option.value = seat.id;
      option.textContent = `${seat.seating_id} ${seat.employee_name ? `- ${seat.employee_name}` : ''} (${seat.seating_availability === 'Occupied' ? '🔴 Occupied' : '🟢 Vacant'})`;
      select.appendChild(option);
    });
    document.getElementById('moveUserModal').classList.add('active');
  };

  window.closeMoveModal = function() { document.getElementById('moveUserModal').classList.remove('active'); sourceSeatToMove = null; };

  window.confirmMove = async function() {
    const targetSeatId = document.getElementById('targetSeatSelect').value;
    if (!targetSeatId) { alert("Please select a destination seat"); return; }
    const sourceSeat = data.find(d => d.id === sourceSeatToMove);
    const targetSeat = data.find(d => d.id === targetSeatId);
    
    FIELDS.forEach(f => { if (f.key !== 'seating_id') targetSeat[f.key] = sourceSeat[f.key] || null; });
    targetSeat.seating_availability = 'Occupied';

    FIELDS.forEach(f => { if (f.key !== 'seating_id' && f.key !== 'seating_availability') sourceSeat[f.key] = null; });
    sourceSeat.seating_availability = 'Vacant';

    await setDoc(doc(db, 'assets', targetSeat.id), targetSeat);
    await setDoc(doc(db, 'assets', sourceSeat.id), sourceSeat);
    document.getElementById('moveUserModal').classList.remove('active');
    alert("User Moved Successfully!");
    loadSeats();
  };

  onAuthStateChanged(auth, user => {
    if (user) { document.getElementById('appContainer').style.display = 'flex'; loadSeats(); }
    else { window.location.href = "login.html"; }
  });
</script>
</body>
</html>
