<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Asset Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Config -->
    <script src="assets/firebase-config.js"></script>
    
    <!-- Shared Theme Controller -->
    <script src="assets/theme.js"></script>
</head>
<body>
    <!-- Theme toggle -->
    <button class="signup-theme-toggle" onclick="toggleTheme()">
        <span id="signupThemeLabel">🌙 Dark</span>
    </button>

    <div class="signup-container">
        <div class="signup-box">
            <div class="logo">📝</div>
            <h1>Create Account</h1>
            <p class="subtitle">Sign up to manage your IT infrastructure</p>
            
            <form id="signupForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="admin@company.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Min 6 characters" required autocomplete="new-password" minlength="6">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn primary" id="signupBtn" style="width:100%;justify-content:center;padding:14px;font-size:16px;">
                    Create Account
                </button>
            </form>
            
            <div class="signup-message" id="signupMessage"></div>
            
            <div class="signup-links">
                <p>Already have an account? <a href="login.html">Sign In</a></p>
            </div>
        </div>
    </div>

    <style>
        /* ============================================
           SIGNUP PAGE SPECIFIC STYLES
        ============================================ */
        
        .signup-theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 18px;
            color: var(--text);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            transition: all 0.3s;
            z-index: 100;
        }
        .signup-theme-toggle:hover {
            border-color: var(--teal);
        }

        .signup-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg);
            padding: 20px;
        }

        .signup-box {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 45px 40px 35px;
            width: 420px;
            max-width: 100%;
            box-shadow: 0 24px 80px var(--panel-shadow);
            transition: all 0.3s;
        }
        .signup-box:hover {
            border-color: var(--teal);
        }

        .signup-box .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 4px;
        }

        .signup-box h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--amber);
            text-align: center;
            margin: 0 0 4px 0;
        }

        .signup-box .subtitle {
            color: var(--muted);
            text-align: center;
            font-size: 14px;
            margin: 0 0 28px 0;
            font-family: 'Inter', sans-serif;
        }

        .signup-box .form-group {
            margin-bottom: 18px;
        }

        .signup-box .form-group label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .signup-box .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }

        .signup-box .form-group input::placeholder {
            color: var(--muted);
            opacity: 0.6;
        }

        .signup-box .form-group input:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(79, 209, 197, 0.15);
        }

        .signup-box .btn.primary {
            background: var(--amber);
            border: none;
            color: #1a1305;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 16px;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }

        .signup-box .btn.primary:hover {
            background: #f0b158;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(227, 165, 66, 0.3);
        }

        .signup-box .btn.primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .signup-message {
            margin-top: 16px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            text-align: center;
            display: none;
        }

        .signup-message.error {
            display: block;
            background: rgba(224, 104, 95, 0.15);
            color: var(--danger);
            border: 1px solid rgba(224, 104, 95, 0.3);
        }

        .signup-message.success {
            display: block;
            background: rgba(76, 175, 80, 0.15);
            color: var(--success);
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .signup-message.info {
            display: block;
            background: rgba(52, 152, 219, 0.15);
            color: #3498db;
            border: 1px solid rgba(52, 152, 219, 0.3);
        }

        .signup-links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--muted);
        }

        .signup-links a {
            color: var(--teal);
            text-decoration: none;
            font-weight: 600;
        }

        .signup-links a:hover {
            text-decoration: underline;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .password-strength {
            margin-top: 6px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
        }
        .password-strength .weak { color: var(--danger); }
        .password-strength .medium { color: #f39c12; }
        .password-strength .strong { color: var(--success); }

        @media (max-width: 480px) {
            .signup-box {
                padding: 30px 20px 25px;
            }
            .signup-box h1 {
                font-size: 24px;
            }
            .signup-box .logo {
                font-size: 40px;
            }
            .signup-box .subtitle {
                font-size: 13px;
                margin-bottom: 20px;
            }
            .signup-box .form-group input {
                font-size: 13px;
                padding: 10px 14px;
            }
            .signup-box .btn.primary {
                font-size: 14px;
                padding: 12px;
            }
            .signup-theme-toggle {
                top: 12px;
                right: 12px;
                font-size: 12px;
                padding: 6px 14px;
            }
        }
    </style>

    <script>
        // ============================================
        // DOM ELEMENTS
        // ============================================
        const signupForm = document.getElementById('signupForm');
        const fullNameInput = document.getElementById('fullName');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const signupBtn = document.getElementById('signupBtn');
        const messageEl = document.getElementById('signupMessage');

        // ============================================
        // UPDATE THEME LABEL
        // ============================================
        function updateSignupThemeLabel() {
            const isLight = document.body.classList.contains('light-mode');
            const label = document.getElementById('signupThemeLabel');
            if (isLight) {
                label.textContent = '☀️ Light';
            } else {
                label.textContent = '🌙 Dark';
            }
        }

        // ============================================
        // CHECK IF ALREADY LOGGED IN
        // ============================================
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        // ============================================
        // PASSWORD STRENGTH CHECKER
        // ============================================
        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.match(/[a-z]+/)) strength++;
            if (password.match(/[A-Z]+/)) strength++;
            if (password.match(/[0-9]+/)) strength++;
            if (password.match(/[$@#&!]+/)) strength++;
            
            if (strength <= 2) return { level: 'Weak', class: 'weak' };
            if (strength <= 3) return { level: 'Medium', class: 'medium' };
            return { level: 'Strong', class: 'strong' };
        }

        // ============================================
        // SIGNUP FORM SUBMIT
        // ============================================
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = fullNameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Validate fields
            if (!fullName) {
                showMessage('Please enter your full name', 'error');
                return;
            }

            if (!email) {
                showMessage('Please enter your email address', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('Passwords do not match!', 'error');
                return;
            }

            // Disable button and show loading
            signupBtn.disabled = true;
            signupBtn.innerHTML = '<span class="loading-spinner"></span> Creating account...';
            showMessage('', '');

            try {
                // Step 1: Create user with Firebase Auth
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                console.log('✅ User created:', user.uid);

                // Step 2: Save user data to Firestore
                await db.collection('users').doc(user.uid).set({
                    uid: user.uid,
                    fullName: fullName,
                    email: email,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    role: 'user',
                    isActive: true
                });

                console.log('✅ User data saved to Firestore');

                // Step 3: Update profile with display name
                await user.updateProfile({
                    displayName: fullName
                });

                showMessage('✅ Account created successfully! Redirecting...', 'success');

                // Redirect to dashboard after 2 seconds
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);

            } catch (error) {
                console.error('❌ Signup error:', error);
                let errorMsg = 'Signup failed. Please try again.';
                if (error.code === 'auth/email-already-in-use') {
                    errorMsg = 'This email is already registered. Please login instead.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = 'Invalid email address format.';
                } else if (error.code === 'auth/weak-password') {
                    errorMsg = 'Password is too weak. Please use a stronger password.';
                } else if (error.code === 'auth/network-request-failed') {
                    errorMsg = 'Network error. Please check your connection.';
                }
                showMessage('❌ ' + errorMsg, 'error');
                signupBtn.disabled = false;
                signupBtn.textContent = 'Create Account';
            }
        });

        // ============================================
        // SHOW MESSAGE
        // ============================================
        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'signup-message' + (type ? ' ' + type : '');
        }

        // ============================================
        // PASSWORD STRENGTH - Real-time feedback
        // ============================================
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            const strengthDiv = document.getElementById('passwordStrength') || document.createElement('div');
            
            if (!document.getElementById('passwordStrength')) {
                strengthDiv.id = 'passwordStrength';
                strengthDiv.className = 'password-strength';
                this.parentNode.appendChild(strengthDiv);
            }

            if (password.length === 0) {
                strengthDiv.innerHTML = '';
                return;
            }

            const result = checkPasswordStrength(password);
            strengthDiv.innerHTML = `Password strength: <span class="${result.class}">${result.level}</span>`;
        });

        // ============================================
        // UPDATE THEME LABEL ON LOAD
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            updateSignupThemeLabel();
        });

        // Watch for theme changes
        setInterval(updateSignupThemeLabel, 500);
    </script>
</body>
</html>
