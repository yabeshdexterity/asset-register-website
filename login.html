<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Asset Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Config -->
    <script src="assets/firebase-config.js"></script>
    
    <!-- Shared Theme Controller -->
    <script src="assets/theme.js"></script>
</head>
<body>
    <!-- Theme toggle on login page -->
    <button class="login-theme-toggle" onclick="toggleTheme()">
        <span id="loginThemeLabel">🌙 Dark</span>
    </button>

    <div class="login-container">
        <div class="login-box">
            <div class="logo">🔐</div>
            <h1>Asset Register</h1>
            <p class="subtitle">Sign in to manage your IT infrastructure</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="admin@company.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn primary" id="loginBtn" style="width:100%;justify-content:center;padding:14px;font-size:16px;">
                    Sign In
                </button>
            </form>
            
            <div class="login-message" id="loginMessage"></div>
            
            <div class="login-links">
                <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
                <p style="margin-top:8px;font-size:12px;color:var(--muted);">
                    Demo: admin@company.com / admin123
                </p>
            </div>
        </div>
    </div>

    <style>
        /* ============================================
           LOGIN PAGE SPECIFIC STYLES
        ============================================ */
        
        .login-theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 18px;
            color: var(--text);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            transition: all 0.3s;
            z-index: 100;
        }
        .login-theme-toggle:hover {
            border-color: var(--teal);
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg);
            padding: 20px;
        }

        .login-box {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 45px 40px 35px;
            width: 420px;
            max-width: 100%;
            box-shadow: 0 24px 80px var(--panel-shadow);
            transition: all 0.3s;
        }
        .login-box:hover {
            border-color: var(--teal);
        }

        .login-box .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 4px;
        }

        .login-box h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--amber);
            text-align: center;
            margin: 0 0 4px 0;
        }

        .login-box .subtitle {
            color: var(--muted);
            text-align: center;
            font-size: 14px;
            margin: 0 0 28px 0;
            font-family: 'Inter', sans-serif;
        }

        .login-box .form-group {
            margin-bottom: 18px;
        }

        .login-box .form-group label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .login-box .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }

        .login-box .form-group input::placeholder {
            color: var(--muted);
            opacity: 0.6;
        }

        .login-box .form-group input:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(79, 209, 197, 0.15);
        }

        .login-box .btn.primary {
            background: var(--amber);
            border: none;
            color: #1a1305;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 16px;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }

        .login-box .btn.primary:hover {
            background: #f0b158;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(227, 165, 66, 0.3);
        }

        .login-box .btn.primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .login-message {
            margin-top: 16px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            text-align: center;
            display: none;
        }

        .login-message.error {
            display: block;
            background: rgba(224, 104, 95, 0.15);
            color: var(--danger);
            border: 1px solid rgba(224, 104, 95, 0.3);
        }

        .login-message.success {
            display: block;
            background: rgba(76, 175, 80, 0.15);
            color: var(--success);
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .login-links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--muted);
        }

        .login-links a {
            color: var(--teal);
            text-decoration: none;
            font-weight: 600;
        }

        .login-links a:hover {
            text-decoration: underline;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 30px 20px 25px;
            }
            .login-box h1 {
                font-size: 24px;
            }
            .login-box .logo {
                font-size: 40px;
            }
            .login-box .subtitle {
                font-size: 13px;
                margin-bottom: 20px;
            }
            .login-box .form-group input {
                font-size: 13px;
                padding: 10px 14px;
            }
            .login-box .btn.primary {
                font-size: 14px;
                padding: 12px;
            }
            .login-theme-toggle {
                top: 12px;
                right: 12px;
                font-size: 12px;
                padding: 6px 14px;
            }
        }
    </style>

    <script>
        // ============================================
        // DOM ELEMENTS
        // ============================================
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const messageEl = document.getElementById('loginMessage');

        // ============================================
        // UPDATE LOGIN THEME LABEL
        // ============================================
        function updateLoginThemeLabel() {
            const isLight = document.body.classList.contains('light-mode');
            const label = document.getElementById('loginThemeLabel');
            if (isLight) {
                label.textContent = '☀️ Light';
            } else {
                label.textContent = '🌙 Dark';
            }
        }

        // ============================================
        // CHECK IF ALREADY LOGGED IN
        // ============================================
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        // ============================================
        // LOGIN FORM SUBMIT
        // ============================================
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showMessage('Please enter both email and password', 'error');
                return;
            }

            // Disable button and show loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span> Signing in...';
            showMessage('', '');

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                console.log('✅ Login successful:', userCredential.user.email);
                showMessage('✅ Login successful! Redirecting...', 'success');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (error) {
                console.error('❌ Login error:', error);
                let errorMsg = 'Login failed. Please try again.';
                if (error.code === 'auth/user-not-found') {
                    errorMsg = 'No account found with this email. Please sign up first.';
                } else if (error.code === 'auth/wrong-password') {
                    errorMsg = 'Incorrect password. Please try again.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = 'Invalid email address format.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMsg = 'Too many failed attempts. Please try again later.';
                }
                showMessage('❌ ' + errorMsg, 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        // ============================================
        // SHOW MESSAGE
        // ============================================
        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'login-message' + (type ? ' ' + type : '');
        }

        // Allow Enter key to submit
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });

        // ============================================
        // UPDATE THEME LABEL ON LOAD
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            updateLoginThemeLabel();
        });

        // Watch for theme changes
        setInterval(updateLoginThemeLabel, 500);
    </script>
</body>
</html>
