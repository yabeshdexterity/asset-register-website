<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extra Assets - Asset Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <!-- Firebase Config -->
    <script src="assets/firebase-config.js"></script>
    
    <style>
        .assets-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .assets-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .assets-header h2 {
            font-family: 'Space Grotesk';
            font-size: 28px;
            color: var(--text);
            margin: 0;
        }
        .assets-header p {
            color: var(--muted);
            margin: 5px 0 0;
            font-size: 14px;
        }
        .btn-primary {
            background: var(--teal);
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-family: 'Inter';
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background: var(--teal-hover);
            transform: translateY(-2px);
        }
        .btn-danger {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-family: 'JetBrains Mono';
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .category-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }
        .category-card:hover {
            border-color: var(--teal);
        }
        .category-card .category-title {
            font-family: 'Space Grotesk';
            font-size: 20px;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--line);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .category-card .category-title .count {
            font-family: 'JetBrains Mono';
            font-size: 14px;
            color: var(--muted);
        }
        .asset-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--line);
            font-size: 13px;
        }
        .asset-item:last-child {
            border-bottom: none;
        }
        .asset-item .brand {
            color: var(--text);
            font-weight: 500;
        }
        .asset-item .quantity {
            font-family: 'JetBrains Mono';
            color: var(--teal);
            font-weight: 600;
        }
        .asset-item .actions {
            display: flex;
            gap: 8px;
        }
        .add-item-form {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .add-item-form input {
            flex: 1;
            padding: 8px 12px;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 6px;
            color: var(--text);
            font-family: 'Inter';
            font-size: 13px;
            min-width: 100px;
        }
        .add-item-form input:focus {
            outline: none;
            border-color: var(--teal);
        }
        .add-item-form button {
            padding: 8px 16px;
            background: var(--teal);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-family: 'Inter';
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .add-item-form button:hover {
            opacity: 0.8;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }
        .empty-state .icon {
            font-size: 36px;
            margin-bottom: 10px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--panel);
            color: var(--text);
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid var(--line);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 999;
            font-family: 'JetBrains Mono';
            font-size: 13px;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .total-assets {
            font-family: 'Space Grotesk';
            font-size: 16px;
            color: var(--muted);
            margin-top: 20px;
            text-align: center;
        }
        .total-assets strong {
            color: var(--teal);
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="brand"><h1>Asset Register</h1><p>IT Infrastructure</p></div>
            <div class="nav-menu">
                <a href="index.html" class="nav-item">📊 Dashboard</a>
                <a href="system-details.html" class="nav-item">🖥️ System Details</a>
                <a href="rentals.html" class="nav-item">🚚 Rental Details</a>
                <a href="extra-assets.html" class="nav-item active">📦 Extra Assets</a>
                <a href="path-manager.html" class="nav-item">🗂️ Path Manager</a>
                <button class="theme-toggle" onclick="toggleTheme()" style="margin-top:20px;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 20v-2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m20 0h-2M4.22 19.78l1.42-1.42M17.66 5.34l1.42-1.42"/></svg>
                    <span id="themeLabel">Light Mode</span>
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="assets-container">
                <div class="assets-header">
                    <div>
                        <h2>📦 Extra Assets</h2>
                        <p>Manage CPU, Monitor, Keyboard, and Mouse inventory</p>
                    </div>
                    <button class="btn-primary" onclick="loadAndRender()">🔄 Refresh</button>
                </div>

                <div id="assetsGrid">
                    <div class="empty-state">
                        <div class="icon">🔄</div>
                        <p>Loading extra assets...</p>
                    </div>
                </div>

                <div class="total-assets" id="totalAssets">
                    Total: <strong id="totalCount">0</strong> items
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let extraAssetsData = {};
        const categories = ['cpu', 'monitor', 'keyboard', 'mouse'];
        const categoryIcons = {
            'cpu': '🖥️',
            'monitor': '🖥️',
            'keyboard': '⌨️',
            'mouse': '🖱️'
        };

        // ============================================
        // LOAD DATA FROM FIRESTORE
        // ============================================

        async function loadData() {
            try {
                const snapshot = await db.collection('extraAssets').get();
                extraAssetsData = {};
                
                // Initialize all categories
                categories.forEach(cat => {
                    extraAssetsData[cat] = [];
                });
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.category && extraAssetsData[data.category] !== undefined) {
                        extraAssetsData[data.category] = data.items || [];
                    }
                });
                
                console.log('✅ Loaded extra assets:', extraAssetsData);
                return extraAssetsData;
            } catch (error) {
                console.error('❌ Error loading extra assets:', error);
                showToast('❌ Failed to load data');
                return {};
            }
        }

        // ============================================
        // RENDER CATEGORIES
        // ============================================

        function renderAssets(data) {
            const grid = document.getElementById('assetsGrid');
            
            if (!data || Object.keys(data).length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <h3>No extra assets found</h3>
                        <p>Add items to each category below</p>
                    </div>
                `;
                return;
            }

            let html = '<div class="category-grid">';
            let totalItems = 0;
            
            categories.forEach(cat => {
                const items = data[cat] || [];
                const icon = categoryIcons[cat] || '📦';
                const count = items.length;
                totalItems += count;
                
                html += `
                    <div class="category-card">
                        <div class="category-title">
                            <span>${icon} ${cat.charAt(0).toUpperCase() + cat.slice(1)}</span>
                            <span class="count">${count} items</span>
                        </div>
                        <div id="items-${cat}">
                `;
                
                if (items.length === 0) {
                    html += `<div class="empty-state" style="padding:20px;">
                        <p style="font-size:13px;color:var(--muted);">No items in this category</p>
                    </div>`;
                } else {
                    items.forEach((item, index) => {
                        html += `
                            <div class="asset-item">
                                <span class="brand">${item.brand || 'Unknown'}</span>
                                <span class="quantity">×${item.quantity || 1}</span>
                                <div class="actions">
                                    <button class="btn-danger" onclick="deleteItem('${cat}', ${index})">✕</button>
                                </div>
                            </div>
                        `;
                    });
                }
                
                html += `
                        </div>
                        <form class="add-item-form" onsubmit="addItem(event, '${cat}')">
                            <input type="text" placeholder="Brand name" id="brand-${cat}" required>
                            <input type="number" placeholder="Qty" id="qty-${cat}" value="1" min="1" style="max-width:70px;">
                            <button type="submit">+ Add</button>
                        </form>
                    </div>
                `;
            });
            
            html += '</div>';
            grid.innerHTML = html;
            document.getElementById('totalCount').textContent = totalItems;
        }

        // ============================================
        // ADD ITEM
        // ============================================

        async function addItem(event, category) {
            event.preventDefault();
            
            const brandInput = document.getElementById(`brand-${category}`);
            const qtyInput = document.getElementById(`qty-${category}`);
            
            const brand = brandInput.value.trim();
            const quantity = parseInt(qtyInput.value) || 1;
            
            if (!brand) {
                showToast('❌ Please enter a brand name');
                return;
            }
            
            try {
                // Get current items
                const snapshot = await db.collection('extraAssets')
                    .where('category', '==', category)
                    .get();
                
                let existingItems = [];
                let docId = null;
                
                snapshot.forEach(doc => {
                    existingItems = doc.data().items || [];
                    docId = doc.id;
                });
                
                // Add new item
                existingItems.push({ brand, quantity });
                
                // Update or create document
                if (docId) {
                    await db.collection('extraAssets').doc(docId).update({
                        items: existingItems
                    });
                } else {
                    await db.collection('extraAssets').add({
                        category: category,
                        items: existingItems
                    });
                }
                
                showToast(`✅ Added ${brand} to ${category}`);
                brandInput.value = '';
                qtyInput.value = '1';
                await loadAndRender();
                
            } catch (error) {
                console.error('❌ Error adding item:', error);
                showToast('❌ Failed to add item');
            }
        }

        // ============================================
        // DELETE ITEM
        // ============================================

        async function deleteItem(category, index) {
            if (!confirm(`Remove this item from ${category}?`)) return;
            
            try {
                const snapshot = await db.collection('extraAssets')
                    .where('category', '==', category)
                    .get();
                
                let docId = null;
                let items = [];
                
                snapshot.forEach(doc => {
                    docId = doc.id;
                    items = doc.data().items || [];
                });
                
                if (!docId) {
                    showToast('❌ Category not found');
                    return;
                }
                
                // Remove item at index
                items.splice(index, 1);
                
                await db.collection('extraAssets').doc(docId).update({
                    items: items
                });
                
                showToast('✅ Item removed');
                await loadAndRender();
                
            } catch (error) {
                console.error('❌ Error deleting item:', error);
                showToast('❌ Failed to delete item');
            }
        }

        // ============================================
        // TOAST NOTIFICATION
        // ============================================

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ============================================
        // LOAD AND RENDER
        // ============================================

        async function loadAndRender() {
            const data = await loadData();
            renderAssets(data);
        }

        // ============================================
        // THEME TOGGLE
        // ============================================

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-mode');
            const label = document.getElementById('themeLabel');
            if (body.classList.contains('light-mode')) {
                label.textContent = 'Dark Mode';
                localStorage.setItem('theme', 'light');
            } else {
                label.textContent = 'Light Mode';
                localStorage.setItem('theme', 'dark');
            }
        }

        // ============================================
        // INITIALIZE
        // ============================================

        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            document.getElementById('themeLabel').textContent = 'Dark Mode';
        }

        document.addEventListener('DOMContentLoaded', loadAndRender);
    </script>
</body>
</html>
