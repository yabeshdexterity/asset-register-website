<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extra Assets - Asset Register</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- Firebase Config -->
<script src="assets/firebase-config.js"></script>

<!-- Shared Theme Controller -->
<script src="assets/theme.js"></script>

<style>
    .rental-form {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 30px;
    }
    .rental-form h3 {
        font-family: 'Space Grotesk';
        color: var(--text);
        margin: 0 0 16px 0;
    }
    .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 15px;
    }
    .form-group {
        margin-bottom: 0;
    }
    .form-group label {
        display: block;
        font-family: 'JetBrains Mono';
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 4px;
    }
    .form-group input, .form-group select {
        width: 100%;
        padding: 8px 12px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        font-family: 'Inter';
        font-size: 13px;
    }
    .form-group input:focus, .form-group select:focus {
        outline: none;
        border-color: var(--teal);
    }
    .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-family: 'Inter';
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 13px;
    }
    .btn.primary {
        background: var(--teal);
        color: #fff;
    }
    .btn.primary:hover {
        background: var(--teal-hover);
        transform: translateY(-2px);
    }
    .btn.danger {
        background: rgba(231, 76, 60, 0.15);
        color: #e74c3c;
        border: 1px solid rgba(231, 76, 60, 0.3);
    }
    .btn.danger:hover {
        background: #e74c3c;
        color: #fff;
    }
    .table-container {
        overflow-x: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
    }
    thead {
        background: var(--bg);
        border-bottom: 2px solid var(--line);
    }
    th {
        padding: 12px 16px;
        text-align: left;
        font-family: 'JetBrains Mono';
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        white-space: nowrap;
    }
    td {
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        color: var(--text);
    }
    tr:hover {
        background: var(--panel-alt);
    }
    .nav-item {
        display: block;
        padding: 10px 16px;
        border-radius: 8px;
        text-decoration: none;
        color: var(--text);
        font-family: 'Inter';
        font-weight: 500;
        transition: all 0.2s;
        margin-bottom: 4px;
    }
    .nav-item:hover {
        background: var(--panel-alt);
    }
    .nav-item.active {
        background: var(--teal-dim);
        color: var(--teal);
    }
    .theme-toggle {
        background: var(--panel-alt);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 16px;
        color: var(--text);
        cursor: pointer;
        font-family: 'Inter';
        font-weight: 500;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .theme-toggle:hover {
        border-color: var(--teal);
    }
    .logout-btn {
        background: rgba(231, 76, 60, 0.15);
        border: 1px solid rgba(231, 76, 60, 0.3);
        border-radius: 8px;
        padding: 10px 16px;
        color: #e74c3c;
        cursor: pointer;
        font-family: 'Inter';
        font-weight: 500;
        transition: all 0.2s;
    }
    .logout-btn:hover {
        background: #e74c3c;
        color: #fff;
    }
</style>
</head>
<body>
<div class="app-container" id="appContainer" style="display:none;">
  <div class="sidebar">
    <div class="brand"><h1>Asset Register</h1><p>IT Infrastructure</p></div>
    <div class="nav-menu">
      <a href="index.html" class="nav-item">📊 Dashboard</a>
      <a href="system-details.html" class="nav-item">🖥️ System Details</a>
      <a href="rentals.html" class="nav-item">🚚 Rental Details</a>
      <a href="extra-assets.html" class="nav-item active">📦 Extra Assets</a>
      <a href="path-manager.html" class="nav-item">🗂️ Path Manager</a>
      <a href="settings.html" class="nav-item">⚙️ Settings</a>
      <button class="theme-toggle" onclick="toggleTheme()" style="margin-top:10px; width:100%;">
        <span>☀️</span>
        <span id="themeLabel">Light Mode</span>
      </button>
      <button class="logout-btn" onclick="logout()" style="margin-top:10px; width:100%;">Logout</button>
    </div>
  </div>

  <div class="main-content">
    <div class="topbar"><h2>📦 Extra Assets</h2></div>
    <div class="rental-form">
      <h3>Add Extra Asset</h3>
      <div class="form-grid">
        <div class="form-group"><label>Asset Type</label><select id="assetType"><option value="cpu">CPU</option><option value="monitor">Monitor</option><option value="keyboard">Keyboard</option><option value="mouse">Mouse</option></select></div>
        <div class="form-group"><label>Brand</label><select id="assetBrand"></select></div>
        <div class="form-group"><label>Quantity</label><input type="number" id="assetQuantity" value="1" min="1"></div>
      </div>
      <button class="btn primary" onclick="addAsset()">+ Add Asset</button>
    </div>
    <div class="table-container">
      <table><thead><tr><th>Category</th><th>Brand</th><th>Quantity</th><th>Actions</th></tr></thead><tbody id="assetTableBody"></tbody></table>
    </div>
  </div>
</div>

<script>
  // Firebase is already initialized from CDN scripts
  // auth and db are available from firebase-config.js

  const BRAND_OPTIONS = { 
    cpu: ['ACER', 'DELL', 'ZEBRONICS', 'COOLER MASTER', 'POWER X'], 
    monitor: ['ACER', 'DELL', 'ZEBSTER', 'ZEBRONICS', 'THINK VISION', 'HP', 'KRYSTAA', 'VIEWSONIC', 'LENOVO', 'LG'], 
    keyboard: ['DELL', 'LOGITECH', 'HP', 'PORTRONIC', 'ZEBRONICS'], 
    mouse: ['DELL', 'LOGITECH', 'PORTRONICS', 'ZEBRONICS'] 
  };
  let extraAssets = [];

  window.logout = async function() { 
    await auth.signOut(); 
    window.location.href = "login.html"; 
  };

  async function loadAssets() {
    try {
      const querySnapshot = await db.collection('extraAssets').get();
      extraAssets = [];
      querySnapshot.forEach((doc) => { 
        extraAssets.push({ id: doc.id, ...doc.data() }); 
      });
      renderAssets();
      console.log('✅ Loaded', extraAssets.length, 'extra assets');
    } catch (error) {
      console.error('❌ Error loading extra assets:', error);
      alert('Failed to load extra assets');
    }
  }

  function renderAssets() {
    const tbody = document.getElementById('assetTableBody'); 
    tbody.innerHTML = '';
    if (extraAssets.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--muted);">No extra assets found. Add one above!</td></tr>`;
      return;
    }
    extraAssets.forEach((item, i) => {
      tbody.innerHTML += `<tr><td>${item.category || ''}</td><td>${item.brand || ''}</td><td>${item.quantity || 1}</td><td><button class="btn danger" style="padding:4px 12px;font-size:12px;" onclick="deleteAsset(${i})">🗑️</button></td></tr>`;
    });
  }

  function updateBrands() { 
    const type = document.getElementById('assetType').value; 
    const select = document.getElementById('assetBrand'); 
    select.innerHTML = '<option value="">Select Brand...</option>'; 
    (BRAND_OPTIONS[type] || []).forEach(b => select.innerHTML += `<option value="${b}">${b}</option>`); 
  }

  window.addAsset = async function() {
    const type = document.getElementById('assetType').value;
    const brand = document.getElementById('assetBrand').value;
    const qty = parseInt(document.getElementById('assetQuantity').value) || 1;
    if (!brand) {
      alert("Please select a brand");
      return;
    }
    try {
      await db.collection('extraAssets').add({ 
        category: type, 
        brand, 
        quantity: qty 
      });
      loadAssets(); 
      alert("Asset added!");
    } catch (error) {
      console.error('❌ Error adding asset:', error);
      alert('Failed to add asset');
    }
  };

  window.deleteAsset = async function(i) {
    if (!confirm('Delete this asset?')) return;
    try {
      await db.collection('extraAssets').doc(extraAssets[i].id).delete();
      loadAssets();
    } catch (error) {
      console.error('❌ Error deleting asset:', error);
      alert('Failed to delete asset');
    }
  };

  document.getElementById('assetType').onchange = updateBrands;
  updateBrands();

  // Auth check
  auth.onAuthStateChanged(user => {
    if (user) { 
      document.getElementById('appContainer').style.display = 'flex'; 
      loadAssets(); 
    }
    else { 
      window.location.href = "login.html"; 
    }
  });
</script>
</body>
</html>
